name: Offline host checks

on:
  push:
  pull_request:
  workflow_dispatch:

# No repository writes, secrets, deployments, artifacts or private firmware inputs.
permissions:
  contents: read

concurrency:
  group: offline-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  offline-checks:
    name: Public host, provenance, Wasm and DOM checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out public sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.14'
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install pinned public test dependencies
        timeout-minutes: 5
        run: |
          python -m venv "$RUNNER_TEMP/offline-checks-venv"
          "$RUNNER_TEMP/offline-checks-venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: -r ci/requirements.txt
          npm ci --prefix ci --ignore-scripts --no-audit --no-fund
      - name: Run shared offline checks
        timeout-minutes: 14
        run: |
          export PATH="$RUNNER_TEMP/offline-checks-venv/bin:$PATH"
          python -B ci/run_offline_checks.py
